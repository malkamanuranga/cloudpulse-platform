apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cloudpulse-prod
resources:
  - ../../base
images:
  - name: cloudpulse-api
    newName: docker.io/malkamanuranga/cloudpulse-api
    newTag: latest
patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: cloudpulse-api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 10
