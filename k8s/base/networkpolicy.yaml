apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloudpulse-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cloudpulse-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
