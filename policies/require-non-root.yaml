apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-non-root
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: run-as-non-root
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["cloudpulse-*"]
      validate:
        message: "Pods must set runAsNonRoot to true."
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
