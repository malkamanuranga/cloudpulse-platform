apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudpulse-dev
  namespace: argocd
spec:
  project: cloudpulse
  source:
    repoURL: https://github.com/malkamanuranga/cloudpulse-platform.git
    targetRevision: main
    path: k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudpulse-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
