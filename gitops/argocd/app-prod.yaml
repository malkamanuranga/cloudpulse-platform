apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudpulse-prod
  namespace: argocd
spec:
  project: cloudpulse
  source:
    repoURL: https://github.com/malkamanuranga/cloudpulse-platform.git
    targetRevision: main
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudpulse-prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
