services:
  api:
    build: .
    ports:
      - "3000:3000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus-local.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api
