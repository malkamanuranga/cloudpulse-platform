name: Kubernetes manifests

on:
  pull_request:
    paths: ["k8s/**"]
  push:
    branches: [main]
    paths: ["k8s/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Render and validate overlays
        run: |
          for env in dev prod; do
            kubectl kustomize k8s/overlays/$env | kubeconform -strict -summary
          done
